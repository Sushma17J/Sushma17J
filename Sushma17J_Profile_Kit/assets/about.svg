<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="About Sushma Joshi">
<title>About Sushma Joshi</title>
<defs>
  <linearGradient id="violetWash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8878F2"/><stop offset="1" stop-color="#5D4BD1"/></linearGradient>
  <linearGradient id="coralWash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFA18E"/><stop offset="1" stop-color="#F07868"/></linearGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#6E5AE6" opacity=".16"/></pattern>
</defs>

<rect width="1000" height="210" rx="24" fill="#FFFFFF" stroke="#E9E5F4"/>
<rect x="0" y="0" width="12" height="210" rx="6" fill="#6E5AE6"/>
<text x="42" y="48" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#F27C6B">A LITTLE ABOUT ME</text>
<text x="42" y="89" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#29243B">Curious about AI. Motivated by real-world ideas.</text>
<text x="42" y="127" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#777187">I enjoy creating practical applications that make information and everyday tasks easier.</text>
<text x="42" y="154" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#777187">My projects explore Generative AI, RAG-based search, image processing, translation and Python development.</text>
<rect x="42" y="174" width="192" height="23" rx="11" fill="#F0EDFF"/><text x="138" y="190" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#6E5AE6">HANDS-ON LEARNING</text>
<rect x="245" y="174" width="170" height="23" rx="11" fill="#FFF0E9"/><text x="330" y="190" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#F27C6B">PRACTICAL PROJECTS</text>

</svg>