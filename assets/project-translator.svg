    <text x="28" y="76" font-size="20" font-weight="750" fill="#F8F5FF">English to Kannada</text>
    <text x="28" y="105" font-size="11.5" fill="#B9B0CB">Translate English text into natural Kannada.</text>
    <text x="28" y="143" font-size="10" font-weight="700" fill="#F8F5FF">Groq  ·  LangChain  ·  Streamlit</text>
    <g transform="translate(405 94) scale(.34)">
