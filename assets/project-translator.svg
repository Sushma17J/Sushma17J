<svg xmlns="http://www.w3.org/2000/svg" width="480" height="178" viewBox="0 0 480 178" role="img" aria-label="English to Kannada">
<title>English to Kannada</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#100D1D"/><stop offset="1" stop-color="#211832"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9B9FF"/><stop offset=".52" stop-color="#A78BFA"/><stop offset="1" stop-color="#7053D6"/></linearGradient>
 <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD0C8"/><stop offset=".55" stop-color="#FF897A"/><stop offset="1" stop-color="#D65A72"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".025"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9DEFF" stop-opacity=".75"/><stop offset="1" stop-color="#9B7CFF" stop-opacity=".1"/></linearGradient>
 <filter id="shadow" x="-30%" y="-35%" width="170%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/><feOffset dy="10" dx="2" result="offset"/><feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#B7A3FF" stroke-opacity=".055" stroke-width="1"/></pattern>
 
 <style>text{font-family:Inter,Arial,Helvetica,sans-serif}</style>
</defs>
<rect width="480" height="178" rx="20" fill="url(#bg)" stroke="#554477"/>
    <path d="M0 20Q0 0 20 0H8V178H20Q0 178 0 158Z" fill="#A78BFA"/>
    <rect x="24" y="17" width="302" height="22" rx="11" fill="#34275A" stroke="#A78BFA" stroke-opacity=".55"/>
