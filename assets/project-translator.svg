      <polygon points="0,-100 85,-50 0,0 -85,-50" fill="url(#violet)" stroke="#FFF" stroke-opacity=".55" stroke-width="2"/>
      <polygon points="-85,-50 0,0 0,100 -85,50" fill="#34275A" stroke="#A78BFA" stroke-opacity=".6" stroke-width="2"/>
      <polygon points="85,-50 0,0 0,100 85,50" fill="#261E37" stroke="#A78BFA" stroke-opacity=".4" stroke-width="2"/>
    </g>
    <circle cx="445" cy="28" r="13" fill="#34275A" stroke="#A78BFA" stroke-opacity=".65"/>
    <path d="M439 28h12m-5 -5l5 5 -5 5" fill="none" stroke="#F8F5FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
