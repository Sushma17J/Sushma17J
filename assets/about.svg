<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="About Sushma Joshi">
<title>About Sushma Joshi</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#100D1D"/><stop offset="1" stop-color="#211832"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9B9FF"/><stop offset=".52" stop-color="#A78BFA"/><stop offset="1" stop-color="#7053D6"/></linearGradient>
 <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD0C8"/><stop offset=".55" stop-color="#FF897A"/><stop offset="1" stop-color="#D65A72"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".025"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9DEFF" stop-opacity=".75"/><stop offset="1" stop-color="#9B7CFF" stop-opacity=".1"/></linearGradient>
 <filter id="shadow" x="-30%" y="-35%" width="170%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/><feOffset dy="10" dx="2" result="offset"/><feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#B7A3FF" stroke-opacity=".055" stroke-width="1"/></pattern>
 
 <style>text{font-family:Inter,Arial,Helvetica,sans-serif}</style>
</defs>
<rect width="1000" height="230" rx="25" fill="url(#bg)" stroke="#554477"/>
<rect x="0" y="0" width="13" height="230" rx="6" fill="url(#coral)"/>
<text x="42" y="45" font-size="11" font-weight="700" letter-spacing="2.6" fill="#FF897A">ABOUT ME</text>
<text x="42" y="84" font-size="26" font-weight="750" fill="#F8F5FF">Curious about AI. Motivated by real-world ideas.</text>
<text x="42" y="124" font-size="14.5" fill="#B9B0CB">I enjoy building practical applications that make information and everyday tasks easier.</text>
<text x="42" y="151" font-size="14.5" fill="#B9B0CB">Projects include RAG search, image processing, translation and Python tools.</text>
<rect x="42" y="177" width="186" height="27" rx="13" fill="#35284E" stroke="#A78BFA" stroke-opacity=".6"/><text x="135" y="195" text-anchor="middle" font-size="10" font-weight="700" fill="#A78BFA">HANDS-ON LEARNING</text>
<rect x="240" y="177" width="188" height="27" rx="13" fill="#452A3D" stroke="#FF897A" stroke-opacity=".65"/><text x="334" y="195" text-anchor="middle" font-size="10" font-weight="700" fill="#F7B8AE">PRACTICAL PROJECTS</text>
<g transform="translate(820 112) scale(0.45)" filter="url(#shadow)">
      <ellipse cx="0" cy="115" rx="100" ry="20" fill="#000" opacity=".30"/>
      <polygon points="0,-105 96,-50 0,6 -96,-50" fill="url(#violet)" stroke="#E8DDFF" stroke-opacity=".7" stroke-width="2"/>
      <polygon points="-96,-50 0,6 0,118 -96,62" fill="#6F56C6" stroke="#C6B4FF" stroke-opacity=".45" stroke-width="2"/>
      <polygon points="96,-50 0,6 0,118 96,62" fill="#40316F" stroke="#C6B4FF" stroke-opacity=".35" stroke-width="2"/>
      <path d="M-70 -50L0 -9L70 -50" fill="none" stroke="#FFF" stroke-opacity=".55" stroke-width="3"/>
      <path d="M0 15V100" stroke="#FFB6AA" stroke-opacity=".8" stroke-width="3"/>
      <path d="M-74 -32L-74 48" stroke="#FFF" stroke-opacity=".22" stroke-width="2"/>
      <path d="M75 -32V48" stroke="#FFB5AA" stroke-opacity=".2" stroke-width="2"/>
    </g>
<ellipse cx="820" cy="116" rx="113" ry="36" transform="rotate(-18 820 116)" fill="none" stroke="#FF897A" stroke-opacity=".5" stroke-width="2"/>
</svg>